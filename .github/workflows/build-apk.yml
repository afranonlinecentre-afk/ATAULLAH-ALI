name: Build Android APK (AFRAN ONLINE CENTRE)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Verify Project Root and package.json
        run: |
          echo "Current working directory: $(pwd)"
          if [ ! -f "package.json" ]; then
            echo "FATAL ERROR: package.json not found in $(pwd)!"
            echo "Directory contents:"
            ls -la
            exit 1
          fi
          echo "Verified package.json in project root."

      - name: 3. Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 4. Install Node Dependencies
        run: |
          echo "Configuring npm to bypass peer dependency graph issues..."
          npm config set legacy-peer-deps true
          
          echo "Installing dependencies with legacy-peer-deps..."
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json. Attempting clean install..."
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps --no-audit --prefer-offline
          else
            echo "No package-lock.json found. Running npm install..."
            npm install --legacy-peer-deps --no-audit --prefer-offline
          fi
          
          echo "Verifying installed dependencies..."
          node -e "require('@capacitor/cli'); console.log('Capacitor CLI is ready.');"

      - name: 5. Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 6. Configure Android SDK Environment
        run: |
          echo "Setting up Android SDK environment..."
          if [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          fi
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

      - name: 7. Build Vite React Web App (dist)
        run: |
          echo "Building production web assets..."
          npm run build
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html was not generated!"
            exit 1
          fi
          echo "Web build successfully created in dist/."

      - name: 8. Initialize & Sync Capacitor Android Project
        run: |
          echo "Checking Capacitor Android project..."
          if [ ! -d "android" ]; then
            echo "Generating native Android project with Capacitor..."
            npx cap add android
          else
            echo "Native Android project directory already exists."
          fi
          echo "Syncing web assets to native Android project..."
          npx cap sync android

      - name: 9. Grant Execute Permissions to Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          ls -la gradlew

      - name: 10. Build Android APK via Gradle
        run: |
          cd android
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Selected build type: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "Running Gradle release build..."
            ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Running Gradle debug build (instantly installable on Android)..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: 11. Locate and Verify Output APK Binary
        run: |
          echo "Searching for generated APK files..."
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            CANDIDATES=(
              "android/app/build/outputs/apk/release/app-release.apk"
              "android/app/build/outputs/apk/release/app-release-unsigned.apk"
              "android/app/build/outputs/apk/debug/app-debug.apk"
            )
          else
            CANDIDATES=(
              "android/app/build/outputs/apk/debug/app-debug.apk"
              "android/app/build/outputs/apk/release/app-release.apk"
              "android/app/build/outputs/apk/release/app-release-unsigned.apk"
            )
          fi
          
          for apk in "${CANDIDATES[@]}"; do
            if [ -f "$apk" ]; then
              FOUND_APK="$apk"
              echo "Found APK at: $FOUND_APK"
              break
            fi
          done
          
          if [ -z "$FOUND_APK" ]; then
            echo "Searching filesystem for any generated .apk file..."
            FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi
          
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "FATAL ERROR: No APK binary was generated by the Gradle build."
            exit 1
          fi
          
          echo "Copying $FOUND_APK to ./AFRAN_ONLINE_CENTRE.apk..."
          cp "$FOUND_APK" ./AFRAN_ONLINE_CENTRE.apk
          
          echo "APK Verification Details:"
          ls -lh AFRAN_ONLINE_CENTRE.apk
          sha256sum AFRAN_ONLINE_CENTRE.apk

      - name: 12. Upload APK Artifact (Direct Phone Download)
        uses: actions/upload-artifact@v4
        with:
          name: AFRAN_ONLINE_CENTRE.apk
          path: AFRAN_ONLINE_CENTRE.apk
          if-no-files-found: error
          retention-days: 30
